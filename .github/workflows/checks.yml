name: Software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install Linux gamepad build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Run host and integration checks
        run: python3 scripts/check.py --gamepad
      - name: Ensure tests leave tracked files unchanged
        run: git diff --exit-code
      - name: Save integration evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-${{ matrix.os }}
          path: build/integration/
          if-no-files-found: ignore
          retention-days: 14
